name: NeoVM libssh dependency fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/libssh-dependency

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/libssh-dependency

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Fetch ARM64 QEMU runtime and inspect ELF dependencies
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="main"
          base_url="https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_ref}/android/app/src/main/jniLibs/arm64-v8a"
          libdir="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$libdir" android/app/src/main/assets/third_party
          for lib in libqemu.so libqemu_img.so libssh.so; do
            curl -fL --retry 3 "${base_url}/${lib}" -o "${libdir}/${lib}"
            test -s "${libdir}/${lib}"
            file "${libdir}/${lib}"
          done
          echo "=== libqemu_img.so ELF dependencies ==="
          readelf -d "${libdir}/libqemu_img.so" | grep NEEDED || true
          echo "=== libssh.so ELF dependencies ==="
          readelf -d "${libdir}/libssh.so" | grep NEEDED || true
          echo "=== libqemu.so ELF dependencies ==="
          readelf -d "${libdir}/libqemu.so" | grep NEEDED || true
          if ! readelf -d "${libdir}/libqemu_img.so" | grep -q 'Shared library: \[libssh.so\]'; then
            echo "::error::libqemu_img.so does not declare libssh.so as a direct dependency; verify upstream binary/source."
            exit 1
          fi
          curl -fL --retry 3 "https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_ref}/LICENSE" -o android/app/src/main/assets/third_party/POCKR-MIT-LICENSE.txt

      - name: Fetch AArch64 UEFI firmware
        shell: bash
        run: |
          set -euo pipefail
          firmware_url="https://raw.githubusercontent.com/AI2TH/Pockr/main/android/app/src/main/assets/firmware/QEMU_EFI.fd"
          mkdir -p android/app/src/main/assets/firmware
          curl -fL --retry 3 "${firmware_url}" -o android/app/src/main/assets/firmware/QEMU_EFI.fd
          test -s android/app/src/main/assets/firmware/QEMU_EFI.fd

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Verify APK native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/lib(qemu|qemu_img|ssh)\.so'
          mkdir -p /tmp/neovm-apk-libs
          for lib in libqemu.so libqemu_img.so libssh.so; do
            unzip -p "$apk" "lib/arm64-v8a/$lib" > "/tmp/neovm-apk-libs/$lib"
            test -s "/tmp/neovm-apk-libs/$lib"
          done
          echo "=== APK libqemu_img.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libqemu_img.so | grep NEEDED || true
          echo "=== APK libssh.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libssh.so | grep NEEDED || true
          echo "=== APK libqemu.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libqemu.so | grep NEEDED || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoVM-libssh-fix-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
