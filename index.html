<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>YangVM Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><div class="brand"><span class="mark">Y</span><div><strong>YangVM</strong><small>MANAGER · V1 PROTOTYPE</small></div></div><span class="status"><i></i> Local mode</span></header>
  <main>
    <section class="intro"><p class="eyebrow">VIRTUAL MACHINE CONTROL</p><h1>내 가상 컴퓨터</h1><p>가상 머신 프로필을 만들고 상태를 관리하세요.</p></section>
    <section class="summary"><div><span>등록된 머신</span><strong id="count">0</strong></div><div><span>실행 중</span><strong id="running">0</strong></div><div><span>할당 메모리</span><strong id="memory">0 GB</strong></div></section>
    <div class="section-head"><h2>머신 목록</h2><button id="add" class="primary">＋ 새 VM 만들기</button></div>
    <div id="machines" class="machines"></div>
    <p class="notice"><b>ⓘ 프로토타입 안내</b> 지금은 가상 머신 관리 화면을 시험하는 버전입니다. 실행 버튼은 상태만 바꾸며 실제 운영체제를 부팅하지 않습니다.</p>
  </main>
  <dialog id="createDialog"><form id="createForm"><div class="dialog-head"><h2>새 가상 머신</h2><button type="button" class="close" id="close">×</button></div>
    <label>머신 이름<input id="vmName" maxlength="28" placeholder="예: My Linux" required></label>
    <label>운영체제<select id="os"><option>Linux</option><option>Windows</option><option>기타 / 테스트</option></select></label>
    <label>메모리 <output id="ramOut">2 GB</output><input id="ram" type="range" min="1" max="4" value="2"></label>
    <div class="dialog-actions"><button type="button" class="secondary" id="cancel">취소</button><button class="primary" type="submit">VM 만들기</button></div>
  </form></dialog>
  <script src="script.js"></script>
</body>
</html>
