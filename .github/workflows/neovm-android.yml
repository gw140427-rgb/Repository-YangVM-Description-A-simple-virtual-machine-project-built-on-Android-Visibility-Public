name: Build NeoVM Android APK

on:
  push:
    branches: [neo-vm-android]
    paths:
      - 'android/**'
      - '.github/workflows/neovm-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned ARM64 QEMU runtime
        run: |
          set -euo pipefail
          upstream_commit="f6d43483cc519987b4048962ea96303d99f3030d"
          api_url="https://api.github.com/repos/AI2TH/Pockr/contents/android/app/src/main/jniLibs/arm64-v8a?ref=${upstream_commit}"
          curl -fL --retry 3 "$api_url" -o /tmp/neovm-qemu-files.json
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets/third_party
          python3 -c 'import json; x=json.load(open("/tmp/neovm-qemu-files.json")); [print(i["name"], i["download_url"]) for i in x if i.get("type")=="file" and i.get("name","").endswith(".so")]' > /tmp/neovm-qemu-files.txt
          while read -r name url; do
            test -n "$name"
            curl -fL --retry 3 "$url" -o "android/app/src/main/jniLibs/arm64-v8a/$name"
          done < /tmp/neovm-qemu-files.txt
          curl -fL --retry 3 "https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_commit}/LICENSE" -o android/app/src/main/assets/third_party/POCKR-MIT-LICENSE.txt
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu_img.so
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoVM-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
