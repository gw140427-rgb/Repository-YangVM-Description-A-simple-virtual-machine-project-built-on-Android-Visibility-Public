name: Build NeoVM Android APK

on:
  push:
    branches: [neo-vm-android]
    paths:
      - 'android/**'
      - '.github/workflows/neovm-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned ARM64 QEMU runtime
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://codeload.github.com/AI2TH/Pockr/zip/f6d43483cc519987b4048962ea96303d99f3030d" -o /tmp/pockr.zip
          unzip -q /tmp/pockr.zip -d /tmp/pockr-src
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets/third_party
          cp -a /tmp/pockr-src/Pockr-f6d43483cc519987b4048962ea96303d99f3030d/android/app/src/main/jniLibs/arm64-v8a/. android/app/src/main/jniLibs/arm64-v8a/
          cp /tmp/pockr-src/Pockr-f6d43483cc519987b4048962ea96303d99f3030d/LICENSE android/app/src/main/assets/third_party/POCKR-MIT-LICENSE.txt
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu_img.so
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoVM-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
