name: NeoVM libssh dependency fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/libssh-dependency

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/libssh-dependency

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid installing the obsolete "tools" package; current sdkmanager exits with an error for it.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Fetch pinned ARM64 QEMU runtime and all bundled libraries
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit="f6d43483cc519987b4048962ea96303d99f3030d"
          libdir="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$libdir" android/app/src/main/assets/third_party
          curl -fL --retry 3 "https://api.github.com/repos/AI2TH/Pockr/git/trees/${upstream_commit}?recursive=1" -o /tmp/pockr-tree.json
          python3 - "$upstream_commit" "$libdir" <<'PY'
          import json, os, sys, urllib.request
          commit, libdir = sys.argv[1], sys.argv[2]
          with open("/tmp/pockr-tree.json", encoding="utf-8") as f:
              tree = json.load(f)["tree"]
          prefix = "android/app/src/main/jniLibs/arm64-v8a/"
          paths = [item["path"] for item in tree if item.get("type") == "blob"
                   and item["path"].startswith(prefix) and item["path"].endswith(".so")]
          if not paths or "android/app/src/main/jniLibs/arm64-v8a/libqemu.so" not in paths:
              raise SystemExit("Pinned upstream tree does not contain the expected ARM64 QEMU runtime")
          if "android/app/src/main/jniLibs/arm64-v8a/libssh.so" not in paths:
              raise SystemExit("Pinned upstream tree does not contain libssh.so")
          os.makedirs(libdir, exist_ok=True)
          for path in paths:
              name = os.path.basename(path)
              url = f"https://raw.githubusercontent.com/AI2TH/Pockr/{commit}/{path}"
              request = urllib.request.Request(url, headers={"User-Agent": "NeoVM-GitHub-Actions"})
              with urllib.request.urlopen(request, timeout=120) as response, open(os.path.join(libdir, name), "wb") as output:
                  output.write(response.read())
              if os.path.getsize(os.path.join(libdir, name)) == 0:
                  raise SystemExit(f"Downloaded empty native library: {name}")
              print(f"Fetched {name} ({os.path.getsize(os.path.join(libdir, name))} bytes)")
          print(f"Fetched {len(paths)} ARM64 shared libraries from pinned source {commit}")
          PY
          curl -fL --retry 3 "https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_commit}/LICENSE" -o android/app/src/main/assets/third_party/POCKR-LICENSE.txt
          curl -fL --retry 3 "https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_commit}/LICENSES.md" -o android/app/src/main/assets/third_party/POCKR-THIRD-PARTY-LICENSES.md
          test -s "${libdir}/libqemu.so"
          test -s "${libdir}/libqemu_img.so"
          test -s "${libdir}/libssh.so"
          echo "=== libqemu_img.so ELF dependencies ==="
          readelf -d "${libdir}/libqemu_img.so" | grep NEEDED
          echo "=== libssh.so ELF dependencies ==="
          readelf -d "${libdir}/libssh.so" | grep NEEDED
          if ! readelf -d "${libdir}/libqemu_img.so" | grep -Fq 'Shared library: [libssh.so]'; then
            echo "::error::libqemu_img.so does not declare libssh.so as a direct dependency"
            exit 1
          fi

      - name: Get AArch64 UEFI firmware from Ubuntu package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-efi-aarch64
          mkdir -p android/app/src/main/assets/firmware
          python3 - <<'PY'
          import glob, os, shutil
          candidates = glob.glob("/usr/share/**/QEMU_EFI.fd", recursive=True)
          candidates += glob.glob("/usr/share/**/AAVMF_CODE.fd", recursive=True)
          candidates = [p for p in candidates if os.path.isfile(p) and os.path.getsize(p) > 0]
          if not candidates:
              raise SystemExit("No usable AArch64 UEFI firmware found in qemu-efi-aarch64 package")
          src = max(candidates, key=lambda p: os.path.getsize(p))
          dst = "android/app/src/main/assets/firmware/QEMU_EFI.fd"
          shutil.copyfile(src, dst)
          print(f"Firmware source: {src}")
          print(f"Firmware size: {os.path.getsize(dst)} bytes")
          PY
          test -s android/app/src/main/assets/firmware/QEMU_EFI.fd
          sha256sum android/app/src/main/assets/firmware/QEMU_EFI.fd

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Verify APK native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/lib(qemu|qemu_img|ssh)\.so'
          mkdir -p /tmp/neovm-apk-libs
          for lib in libqemu.so libqemu_img.so libssh.so; do
            unzip -p "$apk" "lib/arm64-v8a/$lib" > "/tmp/neovm-apk-libs/$lib"
            test -s "/tmp/neovm-apk-libs/$lib"
          done
          echo "=== APK libqemu_img.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libqemu_img.so | grep NEEDED || true
          echo "=== APK libssh.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libssh.so | grep NEEDED || true
          echo "=== APK libqemu.so dependencies ==="
          readelf -d /tmp/neovm-apk-libs/libqemu.so | grep NEEDED || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoVM-libssh-fix-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
