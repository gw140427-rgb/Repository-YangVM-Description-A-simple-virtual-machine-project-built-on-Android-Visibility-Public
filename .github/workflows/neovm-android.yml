name: Build NeoVM Android APK

on:
  push:
    branches: [neo-vm-android]
    paths:
      - 'android/**'
      - '.github/workflows/neovm-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned ARM64 QEMU runtime
        run: |
          set -euo pipefail
          upstream_commit="f6d43483cc519987b4048962ea96303d99f3030d"
          base_url="https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_commit}/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets/third_party
          curl -fL --retry 3 "${base_url}/libqemu.so" -o android/app/src/main/jniLibs/arm64-v8a/libqemu.so
          curl -fL --retry 3 "${base_url}/libqemu_img.so" -o android/app/src/main/jniLibs/arm64-v8a/libqemu_img.so
          curl -fL --retry 3 "https://raw.githubusercontent.com/AI2TH/Pockr/${upstream_commit}/LICENSE" -o android/app/src/main/assets/third_party/POCKR-MIT-LICENSE.txt
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libqemu_img.so
      - name: Fetch AArch64 UEFI firmware
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          cd /tmp
          apt-get download qemu-efi-aarch64
          mkdir -p /tmp/neovm-uefi "$GITHUB_WORKSPACE/android/app/src/main/assets/firmware"
          dpkg-deb -x /tmp/qemu-efi-aarch64_*.deb /tmp/neovm-uefi
          firmware="$(find /tmp/neovm-uefi/usr/share -name 'QEMU_EFI.fd' -o -name 'AAVMF_CODE.fd' | head -n 1)"
          test -n "$firmware"
          cp "$firmware" "$GITHUB_WORKSPACE/android/app/src/main/assets/firmware/QEMU_EFI.fd"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/assets/firmware/QEMU_EFI.fd"
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoVM-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
